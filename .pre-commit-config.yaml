repos:
  - repo: local
    hooks:
      - id: personal-data-gate
        name: Personal-data gate
        entry: python scripts/ci/check_no_personal.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff
        name: ruff lint
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: false
