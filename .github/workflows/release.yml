name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install build
      - name: Build sdist + wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  build-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: cd gshell_memory_schema && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-schema
          path: gshell_memory_schema/dist/

  publish-schema:
    runs-on: ubuntu-latest
    needs: [build-schema]
    environment: pypi-schema
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-schema
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for PyPI to index
        run: sleep 60
      - name: Install from PyPI
        run: python -m pip install "gshell-memory==${GITHUB_REF_NAME#v}"
      - name: Smoke test
        run: |
          gish version
          gish init /tmp/smoke-ws --non-interactive
          gish doctor --workspace /tmp/smoke-ws
